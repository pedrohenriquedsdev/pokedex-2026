<app-navbar></app-navbar>

<!-- O que quer que eu esteja renderizando é carregado aqui -->
<router-outlet></router-outlet>

<main class="mx-auto max-w-5xl px-4 py-8">
  <section class="mb-12 flex flex-col items-center gap-8 md:flex-row md:justify-between">
    <div class="max-w-md text-center md:text-left">
      <p class="font-pixel text-[10px] tracking-widest text-pokedex-yellow uppercase">
        Unidade de busca ativa
      </p>
      <h1
        class="mt-3 font-pixel text-2xl text-pokedex-glow drop-shadow-[0_0_10px_var(--color-pokedex-glow)] sm:text-3xl">
        Pokédex
      </h1>
      <p class="mt-4 text-sm leading-relaxed text-zinc-300">
        Escaneie e catalogue as criaturas encontradas. Toque em um cartão para identificar tipo e
        número de registro.
      </p>
    </div>

    @defer (on viewport) {
    <app-hero-pokebola></app-hero-pokebola>
    } @placeholder {
    <div class="mx-auto h-64 w-64 md:h-80 md:w-80"></div>
    }
  </section>

  <div class="mb-6 flex items-center gap-3">
    <span class="h-px flex-1 bg-pokedex-glow/30" aria-hidden="true"></span>
    <h2 class="font-pixel text-[10px] tracking-widest text-pokedex-glow uppercase">
      Pokémon catalogados
    </h2>
    <span class="h-px flex-1 bg-pokedex-glow/30" aria-hidden="true"></span>
  </div>

  <app-listagem-pokemon></app-listagem-pokemon>
</main>
