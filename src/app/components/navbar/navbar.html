<header
  class="sticky top-0 z-40 border-b border-pokedex-glow/30 bg-pokedex-screen/70 shadow-[0_8px_30px_rgb(0_0_0/0.45)] backdrop-blur-md"
>
  <!-- Filete vermelho neon no topo da barra -->
  <div
    class="h-0.5 bg-gradient-to-r from-transparent via-pokedex-red to-transparent shadow-[0_0_10px_var(--color-pokedex-red)]"
  ></div>

  <nav class="mx-auto flex max-w-5xl flex-wrap items-center justify-between gap-3 px-4 py-3">
    <a
      href="/"
      class="group flex items-center gap-3 rounded-full px-2 py-1 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-pokedex-glow"
    >
      <!-- Mini pokébola: metade vermelha, metade branca, botão central -->
      <span
        class="relative size-7 rounded-full border-2 border-pokedex-glow bg-linear-to-b from-pokedex-red from-50% to-zinc-100 to-50% shadow-[0_0_10px_var(--color-pokedex-glow)]"
      >
        <span
          class="absolute top-1/2 left-1/2 size-2.5 -translate-1/2 rounded-full border-2 border-pokedex-screen bg-zinc-100"
        ></span>
      </span>
      <span
        class="font-pixel text-sm text-pokedex-glow drop-shadow-[0_0_6px_var(--color-pokedex-glow)] transition group-hover:text-pokedex-yellow"
        >Pokédex</span
      >
    </a>

    <ul class="flex items-center gap-1 sm:gap-2">
      @for (item of itensNavbar; track item.titulo) {
        <li>
          <a
            [href]="item.url"
            class="group relative inline-flex items-center rounded-full px-3 py-2 font-pixel text-[10px] tracking-wide text-zinc-300 transition hover:text-pokedex-glow focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-pokedex-glow"
          >
            {{ item.titulo }}
            <!-- Traço ciano que cresce no hover -->
            <span
              class="absolute inset-x-3 -bottom-0.5 h-px origin-left scale-x-0 bg-pokedex-glow shadow-[0_0_6px_var(--color-pokedex-glow)] transition-transform duration-300 group-hover:scale-x-100"
            ></span>
          </a>
        </li>
      }
    </ul>
  </nav>
</header>
